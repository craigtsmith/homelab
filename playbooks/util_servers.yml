---
- name: Validate environment for utility servers
  import_playbook: common/validate_env.yml

- name: Util Servers
  hosts: util_servers
  become: true
  gather_facts: true
  tasks:
    - name: Util role
      ansible.builtin.include_role:
        name: util_server
        tasks_from: main

    - name: CephFS backup role
      ansible.builtin.include_role:
        name: cephfs_backup
