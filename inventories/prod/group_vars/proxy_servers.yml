    force_ssl: false
    hsts: false
  # NPM proxy host 59
  - names: ["nzb.{{ domain }}"]
    upstream: http://{{ appbox1_tailnet_ip }}:8585  # appbox1 over the tailnet
  # NPM proxy host 60
  - names: ["profilarr.{{ domain }}"]
    upstream: http://192.168.100.11:8080
  # NPM proxy host 61
  - names: ["byparr.{{ domain }}"]
