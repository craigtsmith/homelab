  # NPM proxy host 64
  - names: ["navidrome.{{ domain }}"]
    upstream: http://192.168.100.11:8080
  # NPM proxy host 65
  - names: ["aurral.{{ domain }}"]
    upstream: http://{{ appbox1_tailnet_ip }}:3005  # appbox1 over the tailnet
  # NPM proxy host 66
  - names: ["deluge.{{ domain }}"]
    upstream: http://{{ appbox1_tailnet_ip }}:8112  # appbox1 over the tailnet
  - names: ["slskd.{{ domain }}"]
    upstream: http://{{ appbox1_tailnet_ip }}:5030  # appbox1 over the tailnet
  # NPM proxy host 67
