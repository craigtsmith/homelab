---
# UniFi network at the new house (docs/network.md). Spec for the unifi_network role,
# which does not exist yet. Objects are matched by name, never by UniFi IDs.
# Wi-Fi passphrases are in 1Password; SSID names are in private.yml.

unifi_network_networks:
  - name: Home
    vlan: 1
    gateway: 192.168.1.1/24
    dhcp: {start: 192.168.1.100, stop: 192.168.1.249}
    dns: "{{ dns_hosts }}"
  - name: IoT
    vlan: 10
    gateway: 192.168.10.1/24
    dhcp: {start: 192.168.10.100, stop: 192.168.10.249}
    dns: "{{ dns_hosts }}"
  - name: Guest
    vlan: 30
    gateway: 192.168.30.1/24
    isolated: true
    dhcp: {start: 192.168.30.100, stop: 192.168.30.249}
  - name: KVM
    vlan: 90
    gateway: 192.168.90.1/24
    dhcp: {start: 192.168.90.100, stop: 192.168.90.199}
  # Every lab host has a static IP below .200
  - name: Lab
    vlan: 100
    gateway: 192.168.100.1/24
    dhcp: {start: 192.168.100.200, stop: 192.168.100.249}
    dns: "{{ dns_hosts }}"
  # VLAN only: no gateway, no DHCP. It exists only on the Ceph switch.
  - name: Ceph
    vlan: 5
    subnet: 192.168.5.0/24
    vlan_only: true

unifi_network_wifi:
  - name: home
    ssid: "{{ unifi_network_ssid_home }}"
    network: Home
    passphrase_item: unifi-wifi-home
  - name: iot
    ssid: "{{ unifi_network_ssid_iot }}"
    network: IoT
    passphrase_item: unifi-wifi-iot
  - name: guest
    ssid: "{{ unifi_network_ssid_guest }}"
    network: Guest
    passphrase_item: unifi-wifi-guest

# Fixed IPs. mac: ~ means not known yet (read it from the client list after the
# first connect). Lab guests will come from guests.yml (net0 MAC and the static IP).
unifi_network_clients:
  - {name: nas, network: Home, ip: 192.168.1.50, mac: ~}
  - {name: kvm-pve1, network: KVM, ip: 192.168.90.10, mac: ~}
  - {name: kvm-pve2, network: KVM, ip: 192.168.90.20, mac: ~}
  - {name: kvm-pve3, network: KVM, ip: 192.168.90.30, mac: ~}
  - {name: pve1, network: Lab, ip: 192.168.100.10, mac: "98:fa:9b:a8:77:0d"}
  - {name: pve2, network: Lab, ip: 192.168.100.20, mac: "8c:16:45:a5:70:27"}
  - {name: pve3, network: Lab, ip: 192.168.100.30, mac: "98:fa:9b:04:2e:16"}
  - {name: homeassistant, network: Lab, ip: 192.168.100.186, mac: ~}

# Switch ports: native network, and the tagged networks (all, or a list; none if
# absent). The name is the far end of the cable.
unifi_network_ports:
  ucg-fiber:
    - {port: 4, name: ap-u7-pro-xg-wall, native: Home, tagged: [IoT, Guest]}
    - {port: 6, name: flex, native: Home, tagged: all}
  flex:
    - {port: 1, name: pve1-eno1, native: Lab, tagged: all}
    - {port: 2, name: pve2-eno1, native: Lab, tagged: all}
    - {port: 3, name: pve3-eno1, native: Lab, tagged: all}
    - {port: 4, name: kvm-pve1, native: KVM}
    - {port: 5, name: kvm-pve2, native: KVM}
    - {port: 6, name: kvm-pve3, native: KVM}
    - {port: 7, name: nas, native: Home}
    - {port: 8, name: ceph-switch, native: Home}
  # Port numbers depend on the model (not known yet). Ceph traffic stays on this
  # switch: the uplink does not carry VLAN 5.
  ceph-switch:
    - {port: 1, name: pve1-enp2s0, native: Ceph}
    - {port: 2, name: pve2-enp2s0, native: Ceph}
    - {port: 3, name: pve3-enp2s0, native: Ceph}
    - {port: ~, name: flex, native: Home}
