    node: pve1
    type: qemu
    build: manual
    ha: {state: started}
    config:
      # no fs-freeze: pbs backs itself up and a frozen pbs cannot take the backup
      agent: "1,freeze-fs=0"
      balloon: "12288"
      boot: "order=scsi0;ide2;net0"
      cores: "6"
      cpu: "x86-64-v2-AES"
