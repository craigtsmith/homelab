      ipconfig0: "ip=192.168.100.22/24,gw=192.168.100.1,ip6=dhcp"
      machine: "q35"
      memory: "12288"
      net0: "virtio=BC:24:11:E9:F9:5D,bridge=vmbr0,queues=6"
      numa: "0"
      onboot: "1"
      scsi0: "ceph_rbd:vm-116-disk-0,size=32G"
      scsihw: "virtio-scsi-pci"
      serial0: "socket"
      sockets: "1"
      vga: "serial0"
  # dns1: AdGuard Home on .53 since 2026-10-16 16:11, with ct100's MAC. Replaces ct100
  # (adguard, stopped, onboot 0, not in HA, outside the repo) until ct100 is destroyed.
  - vmid: 118
    name: dns1
    node: pve1
    type: lxc
    build: lxc
    ha: {node: pve1}
    config:
      arch: "amd64"
      cores: "1"
      features: "nesting=1"
      memory: "512"
      net0: "name=eth0,bridge=vmbr0,gw=192.168.100.1,hwaddr=7E:AD:DA:F3:2C:93,ip=192.168.100.53/24,type=veth"
      onboot: "1"
      ostype: "debian"
      rootfs: "ceph_rbd:vm-118-disk-0,size=4G"
      swap: "512"
      tags: "ansible"
      unprivileged: "1"
  # dns2: second AdGuard Home on .54 (8a, 2026-10-20), same config as dns1. Kept on
  # another node than dns1 by the HA rule dns-apart.
  - vmid: 119
    name: dns2
