      cicustom: "user=ceph_fs:snippets/user-noble.yml"
      cores: "6"
      cpu: "host"
      ide2: "ceph_rbd:vm-113-cloudinit,media=cdrom"
      ipconfig0: "ip=192.168.100.21/24,gw=192.168.100.1,ip6=dhcp"
      machine: "q35"
      memory: "32768"
      net0: "virtio=BC:24:11:4A:FE:B3,bridge=vmbr0,queues=5"
      numa: "0"
      onboot: "1"
      scsi0: "ceph_rbd:vm-113-disk-0,size=64G"
      scsi1: "local-lvm:vm-113-disk-0,backup=0,cache=writeback,discard=on,iothread=1,size=110G,ssd=1"
      scsihw: "virtio-scsi-single"
