---
# Proxmox guest definitions, generated from the live API config on 2026-10-14.
# Create-only: existing guests are never modified. `config` keys are compared
# against the live guest by the drift report (playbooks/proxmox_guests.yml).
# Disk and cloud-init drive keys hold the live value; on create they are
# rebuilt from the template clone (see roles/proxmox_guests).
# Per-node cloud-init template used when a `build: clone` VM is missing
proxmox_guests_templates:
  pve1: 9010
  pve2: 9020
  pve3: 9030
# 24.04 templates, used for rebuilds and test VMs
proxmox_guests_templates_noble:
  pve1: 9110
  pve2: 9120
  pve3: 9130

# LXC template for `build: lxc` guests and test LXCs (downloaded from the Proxmox
# appliance index when missing; ceph_fs is shared by all nodes)
proxmox_guests_lxc_template: ceph_fs:vztmpl/debian-13-standard_13.6-1_amd64.tar.zst

# Throwaway test and restore VMs; destroy.yml refuses anything outside this range
proxmox_guests_test_range: [800, 899]

# ha: {node: pve1}       - HA resource (state started) plus non-strict node-affinity
#                          rule <name>-affinity (roles/proxmox_cluster_config, tasks/ha.yml)
# ha: {state: started}   - HA resource only
# build: clone    - full clone of the node's template, then config applied
#        template - built from the Ubuntu cloud image named by `image`
#        lxc      - Debian LXC from proxmox_guests_lxc_template, root SSH key injected
#        manual   - the PBS ISO install; not automated yet
# HA resource-affinity rules (roles/proxmox_cluster_config, tasks/ha.yml); a
# negative rule keeps its resources on different nodes
proxmox_cluster_config_ha_resource_affinity:
  - rule: dns-apart
    affinity: negative
    resources: ["ct:118", "ct:119"]
    comment: dns1 and dns2

proxmox_guests:
  - vmid: 115
    name: docker1
    node: pve1
    type: qemu
    build: clone
    clone_from: 9110
    ha: {node: pve1}
    config:
      agent: "enabled=1"
      balloon: "16384"
      boot: "c"
      bootdisk: "scsi0"
      cicustom: "user=ceph_fs:snippets/user-noble.yml"
      cores: "6"
      cpu: "host"
      ide2: "ceph_rbd:vm-115-cloudinit,media=cdrom"
      ipconfig0: "ip=192.168.100.11/24,gw=192.168.100.1,ip6=dhcp"
      machine: "q35"
      memory: "32768"
      net0: "virtio=BC:24:11:3A:5D:B2,bridge=vmbr0,queues=5,trunks=100;200"
      numa: "0"
      onboot: "1"
      scsi0: "ceph_rbd:vm-115-disk-0,size=64G"
      scsi1: "local-lvm:vm-115-disk-0,backup=0,cache=writeback,discard=on,iothread=1,size=110G,ssd=1"
      scsihw: "virtio-scsi-single"
      serial0: "socket"
      sockets: "1"
      vga: "serial0"
  # docker2 on 24.04 since 2026-10-15. Replaces 102 (docker2-old, stopped, outside the
  # repo) until 102 is destroyed.
  - vmid: 113
