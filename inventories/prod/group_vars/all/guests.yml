  - vmid: 117
    name: proxy1
    node: pve3
    type: lxc
    build: lxc
    ha: {node: pve3}
    config:
      arch: "amd64"
      cores: "2"
      features: "nesting=1"
      memory: "1024"
      net0: "name=eth0,bridge=vmbr0,gw=192.168.100.1,hwaddr=BC:24:11:30:6C:23,ip=192.168.100.27/24,type=veth"
      onboot: "1"
      ostype: "debian"
      rootfs: "ceph_rbd:vm-117-disk-0,size=4G"
      swap: "512"
      tags: "ansible"
      unprivileged: "1"
  # util1 on 24.04, rebuilt 2026-10-14. Replaced 109,
  # which is kept stopped (util1-old) until it is destroyed.
  - vmid: 111
    name: util1
    node: pve3
    type: qemu
    build: clone
    clone_from: 9130
    ha: {node: pve3}
    config:
      agent: "enabled=1"
      boot: "c"
      bootdisk: "scsi0"
      cicustom: "user=ceph_fs:snippets/user-noble.yml"
      cores: "6"
      cpu: "host"
      ide2: "ceph_rbd:vm-111-cloudinit,media=cdrom"
      ipconfig0: "ip=192.168.100.12/24,gw=192.168.100.1,ip6=dhcp"
      machine: "q35"
      memory: "8192"
      net0: "virtio=BC:24:11:B6:14:5F,bridge=vmbr0,queues=5"
