---
- name: Restart postgresql
  ansible.builtin.systemd_service:
    name: postgresql
    state: restarted

- name: Restart mysql
  ansible.builtin.systemd_service:
    name: mysql
    state: restarted

- name: Restart valkey
  ansible.builtin.systemd_service:
    name: valkey-server
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
