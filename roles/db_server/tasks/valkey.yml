---
- name: Install percona-release
  ansible.builtin.apt:
    deb: https://repo.percona.com/apt/percona-release_latest.{{ ansible_distribution_release }}_all.deb
    state: present

- name: Enable the Percona Valkey repository
  ansible.builtin.command: percona-release enable {{ db_server_valkey_repo }} release
  args:
    creates: /etc/apt/sources.list.d/percona-{{ db_server_valkey_repo }}-release.list

- name: Install Valkey
  ansible.builtin.apt:
    name:
      - percona-valkey-server
      - percona-valkey-tools
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure Valkey
  ansible.builtin.lineinfile:
    path: "{{ db_server_valkey_conf }}"
    regexp: "^{{ item.key }}\\s"
    line: "{{ item.key }} {{ item.value }}"
  loop: "{{ db_server_valkey_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  notify: Restart valkey

- name: Ensure Valkey is running
  ansible.builtin.systemd_service:
    name: valkey-server
    state: started
    enabled: true
