---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable the daily run
  ansible.builtin.copy:
    src: 20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Restrict to security origins, no reboot
  ansible.builtin.template:
    src: 51unattended-upgrades-homelab.j2
    dest: /etc/apt/apt.conf.d/51unattended-upgrades-homelab
    owner: root
    group: root
    mode: "0644"
    validate: apt-config -c %s dump
