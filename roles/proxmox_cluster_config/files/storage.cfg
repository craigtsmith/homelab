dir: local
	path /var/lib/vz
	content iso,rootdir,snippets,vztmpl,images
	shared 0

lvmthin: local-lvm
	thinpool data
	vgname pve
	content rootdir,images

nfs: synnas01
	export /volume2/HomeLab
	path /mnt/pve/synnas01
	server 192.168.1.50
	content snippets,iso,backup,vztmpl,images

cephfs: ceph_fs
	path /mnt/pve/ceph_fs
	content vztmpl,snippets
	fs-name cephfs
	prune-backups keep-all=1

rbd: ceph_rbd
	content rootdir,images
	krbd 0
	pool cephfs_rbd

pbs: pbs
	datastore pbs-nas
	server 192.168.100.199
	content backup
	fingerprint 18:1b:19:c3:5f:d4:9f:bf:f3:08:d4:f1:9b:bc:08:21:39:61:ee:b4:8d:53:20:28:e9:2a:f8:e6:c0:9e:98:b5
	prune-backups keep-all=1
	username root@pam

