---
- name: Set timezone
  community.general.timezone:
    name: "{{ tz }}"

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ debian_lxc_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# Proxmox rewrites /etc/network/interfaces, so extra routes come from a oneshot unit
- name: Install the static routes unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/static-routes.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Static routes not managed by Proxmox
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=true
      {% for r in debian_lxc_static_routes %}
      ExecStart=/usr/sbin/ip route replace {{ r.to }} via {{ r.via }}
      {% endfor %}

      [Install]
      WantedBy=multi-user.target
  when: debian_lxc_static_routes | length > 0
  register: debian_lxc_routes_unit

- name: Enable and start the static routes unit
  ansible.builtin.systemd_service:
    name: static-routes.service
    enabled: true
    state: "{{ 'restarted' if debian_lxc_routes_unit is changed else 'started' }}"
    daemon_reload: "{{ debian_lxc_routes_unit is changed }}"
  # in check mode on a first run the unit does not exist yet
  when:
    - debian_lxc_static_routes | length > 0
    - not (ansible_check_mode and debian_lxc_routes_unit is changed)
