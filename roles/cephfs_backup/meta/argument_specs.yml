---
# cephfs_backup_pbs_secret is a 1Password lookup and is not validated here.
argument_specs:
  main:
    short_description: Nightly backup of CephFS snapshots to PBS
    options:
      cephfs_backup_dirs:
        type: list
        elements: str
        default: [docker]
        description: Directories under the CephFS mount. Each one is a PBS host backup cephfs-<dir>.
      cephfs_backup_mount:
        type: str
        default: "{{ ceph_client_mount_path | default('/mnt/cephfs') }}"
        description: CephFS mount point on this host.
      cephfs_backup_max_age_hours:
        type: int
        default: 26
        description: A newest snapshot older than this fails the run.
      cephfs_backup_on_calendar:
        type: str
        default: '*-*-* 03:30:00'
        description: OnCalendar of the backup timer.
      cephfs_backup_pbs_host:
        type: str
        default: "{{ hostvars[groups['pbs_servers'][0]].ansible_host }}"
        description: PBS address.
      cephfs_backup_pbs_datastore:
        type: str
        default: pbs-nas
        description: PBS datastore.
      cephfs_backup_pbs_namespace:
        type: str
        default: cephfs
        description: PBS namespace. The token can back up into this namespace only.
      cephfs_backup_pbs_auth_id:
        type: str
        default: cephfs-backup@pbs!{{ inventory_hostname }}
        description: PBS API token ID.
      cephfs_backup_pbs_fingerprint:
        type: str
        default: 18:1b:19:c3:5f:d4:9f:bf:f3:08:d4:f1:9b:bc:08:21:39:61:ee:b4:8d:53:20:28:e9:2a:f8:e6:c0:9e:98:b5
        description: Fingerprint of the PBS certificate.
      cephfs_backup_repo_url:
        type: str
        default: http://download.proxmox.com/debian/pbs-client
        description: URL of the Proxmox pbs-client repository.
      cephfs_backup_repo_suite:
        type: str
        default: trixie
        description: Suite of the pbs-client repository.
      cephfs_backup_keyring_url:
        type: str
        default: https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg
        description: URL of the Proxmox archive key.
      cephfs_backup_keyring_checksum:
        type: str
        default: sha256:136673be77aba35dcce385b28737689ad64fd785a797e57897589aed08db6e45
        description: Checksum of the Proxmox archive key.
      cephfs_backup_package:
        type: str
        default: proxmox-backup-client-static
        description: Client package. The apt pin admits only this package from the repository.
