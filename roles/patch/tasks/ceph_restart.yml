---
# Restart this node's mon, then mgr, when the running version is older than the
# installed one. OSDs and the MDS restart with the node reboot afterwards, so
# mons lead the upgrade (Ceph order: mon, mgr, osd, mds).
- name: Read installed Ceph
  ansible.builtin.command: dpkg-query -W -f '${Version}' ceph-mon
  register: patch_ceph_installed
  changed_when: false
  check_mode: false

- name: Restart outdated daemons
  ansible.builtin.include_tasks: ceph_restart_daemon.yml
  loop: "{{ patch_ceph_restart_daemons }}"
  loop_control:
    loop_var: patch_ceph_daemon
