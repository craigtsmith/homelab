---
- name: Check for /var/run/reboot-required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: patch_reboot_required

- name: Read the newest kernel in /boot
  ansible.builtin.shell: set -o pipefail; ls /boot/vmlinuz-* 2>/dev/null | sed 's|^/boot/vmlinuz-||' | sort -V | tail -1
  args:
    executable: /bin/bash
  register: patch_newest_kernel
  changed_when: false
  check_mode: false
  failed_when: false

- name: Decide on the reboot
  ansible.builtin.set_fact:
    patch_reboot_needed: >-
      {{ patch_reboot == 'always'
         or (patch_reboot == 'auto'
             and (patch_reboot_required.stat.exists
                  or (patch_newest_kernel.stdout | length > 0
                      and patch_newest_kernel.stdout != ansible_facts.kernel))) }}

- name: Show the reboot decision
  ansible.builtin.debug:
    msg: >-
      reboot {{ 'needed' if patch_reboot_needed else 'not needed' }}
      (running {{ ansible_facts.kernel }}, newest {{ patch_newest_kernel.stdout | default('-', true) }},
      reboot-required {{ patch_reboot_required.stat.exists }}, patch_reboot={{ patch_reboot }})
