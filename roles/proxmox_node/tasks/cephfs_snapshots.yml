---
- name: Copy the CephFS snapshot script
  ansible.builtin.template:
    src: cephfs-snapshot.j2
    dest: /usr/local/sbin/cephfs-snapshot
    owner: root
    group: root
    mode: "0750"

- name: Write the CephFS snapshot units
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: /etc/systemd/system/{{ item.name }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - name: cephfs-snapshot.service
      content: |
        [Unit]
        Description=Daily CephFS snapshots
        After=pve-storage.target

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/cephfs-snapshot
    - name: cephfs-snapshot.timer
      content: |
        [Unit]
        Description=Daily CephFS snapshots

        [Timer]
        OnCalendar=*-*-* {{ proxmox_node_cephfs_snapshot_time }} UTC
        Persistent=true

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  register: proxmox_node_cephfs_units
  notify: Reload systemd daemon

- name: Apply systemd changes
  ansible.builtin.meta: flush_handlers

- name: Enable the CephFS snapshot timer
  ansible.builtin.systemd_service:
    name: cephfs-snapshot.timer
    state: started
    enabled: true
  # in check mode a new unit file is not written, so systemd does not know it
  when: not (ansible_check_mode and proxmox_node_cephfs_units.changed)
