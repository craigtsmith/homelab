---
- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present

- name: Add Docker apt signing key
  ansible.builtin.get_url:
    url: "{{ docker_host_repo_url }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    checksum: "{{ docker_host_repo_key_checksum }}"
    owner: root
    group: root
    mode: "0644"

- name: Add Docker apt repository with signed-by
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    owner: root
    group: root
    mode: "0644"
    content: |
      deb [arch={{ docker_host_repo_arch }} signed-by=/etc/apt/keyrings/docker.asc] {{ docker_host_repo_url }} {{ docker_host_repo_codename }} stable
  register: docker_host_repo

# In check mode on a new host the repo is not added, so the packages are not found
- name: Install pinned Docker Engine and CLI
  when: not (ansible_check_mode and docker_host_repo is changed)
  ansible.builtin.apt:
    name: "{{ docker_host_engine_packages | map('regex_replace', '$', '=' + docker_host_engine_version) | list }}"
    state: present
    update_cache: "{{ docker_host_repo is changed }}"
    allow_downgrades: true

- name: Hold Docker Engine and CLI packages
  when: not (ansible_check_mode and docker_host_repo is changed)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ docker_host_engine_packages }}"
